name: "Hiero TCK Runner"
description: "Runs Hiero SDK Technology Compatibility Kit (TCK) tests"
author: "Manish Dait"

inputs:
  rpcServerPort:
    description: "Port of the target JSON-RPC server under test"
    required: false
    default: "8544"
  nodeIp:
    description: "IP address and port of the consensus node"
    required: false
    default: "127.0.0.1:35211"
  nodeAccountId:
    description: "Account ID of the consensus node"
    required: false
    default: "0.0.3"
  operatorAccountId:
    description: "Operator account ID used to sign transactions"
    required: false
    default: "0.0.2"
  operatorPrivateKey:
    description: "Operator account private key"
    required: false
    default: '302e020100300506032b65700422042091132178e72057a1d7528025956fe39b0b847f200ab59b2fdd367017f3087137'
  mirrornodeGrpcUrl:
    description: "Address for the mirror node gRPC service"
    required: false
    default: "127.0.0.1:5600"
  mirrornodeRestUrl:
    description: "REST API URL for the mirror node"
    required: false
    default: "http://127.0.0.1:38081"
  mirrornodeRestJavaUrl:
    description: "Java-based REST API URL for the mirror node"
    required: false
    default: "http://127.0.0.1:8084"
  tckTag:
    description: "Tag or Commit SHA of hiero-sdk-tck"
    required: false
    default: "v0.12.0"
  dockerfilePath:
    description: "Path to the Dockerfile relative to repository root"
    required: false
    default: "./Dockerfile"

runs:
  using: "composite"
  steps:
    - name: Checkout Hiero TCK Repository
      uses: actions/checkout@v4
      with:
        repository: 'hiero-ledger/hiero-sdk-tck'
        ref: ${{ inputs.tckTag }}
        path: 'hiero-tck'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: 'hiero-tck/package-lock.json'
    
    - name: Install TCK Dependencies
      shell: bash
      working-directory: 'hiero-tck'
      run: npm ci

    - name: Build and Start TCK Server Container
      shell: bash
      run: |
        DOCKERFILE_PATH="${{ inputs.dockerfilePath }}"
        RPC_PORT="${{ inputs.rpcServerPort }}"

        if [ -f "$DOCKERFILE_PATH" ]; then
          echo "Found Dockerfile at $DOCKERFILE_PATH. Building server container..."
          
          # 1. Build image using caller repo root context
          docker build -t hiero-rpc-server:local -f "$DOCKERFILE_PATH" .
          
          # 2. Start container in detached mode mapping dynamic port
          docker run -d --name hiero-rpc-container -p "${RPC_PORT}:8544" hiero-rpc-server:local
          
          sleep 5
          echo "Waiting for RPC server on http://localhost:${RPC_PORT}..."
          
          echo "Waiting for RPC server on http://localhost:${RPC_PORT}..."

          for i in {1..60}; do
            if curl --silent --fail -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"reset","params":[],"id":1}' "http://localhost:${RPC_PORT}/" >/dev/null 2>&1; then
              echo "RPC server is ready."
              exit 0
            fi

            echo "RPC server not ready yet ($i/60)..."
            sleep 2
          done

          echo "RPC server failed to become ready."
          docker logs hiero-rpc-container
          exit 1
        else
          echo "No Dockerfile found at $DOCKERFILE_PATH. Skipping container execution."
        fi

    - name: Run TCK Test Suite
      shell: bash
      working-directory: 'hiero-tck'
      env:
        OPERATOR_ACCOUNT_ID: ${{ inputs.operatorAccountId }}
        OPERATOR_ACCOUNT_PRIVATE_KEY: ${{ inputs.operatorPrivateKey }}
        NODE_IP: ${{ inputs.nodeIp }}
        NODE_ACCOUNT_ID: ${{ inputs.nodeAccountId }}
        NODE_TIMEOUT: 30000
        MIRROR_NETWORK: ${{ inputs.mirrornodeGrpcUrl }}
        MIRROR_NODE_REST_URL: ${{ inputs.mirrornodeRestUrl }}
        MIRROR_NODE_REST_JAVA_URL: ${{ inputs.mirrornodeRestJavaUrl }}
        JSON_RPC_SERVER_URL: "http://localhost:${{ inputs.rpcServerPort }}/"
      run: npm run test
    
    - name: CleanUp RPC Server Container
      if: always()
      shell: bash
      run: |
        if [ "$(docker ps -aq -f name=hiero-rpc-container)" ]; then
          echo "Stopping and removing RPC server container..."
          docker rm -f hiero-rpc-container || true
        fi
